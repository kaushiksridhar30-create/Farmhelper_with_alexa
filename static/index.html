<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Farm Helper for Alexa+</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0b1d2a;color:#e8f4f8;display:flex;justify-content:center;padding:24px}
.app{width:100%;max-width:560px}h1{font-size:22px;margin:0 0 4px}.sub{color:#7fb8d6;font-size:13px;margin-bottom:16px}
.ring{width:84px;height:84px;border-radius:50%;margin:12px auto;border:6px solid #00caff;box-shadow:0 0 24px #00caff88;transition:.3s}
.ring.on{animation:p 1s infinite}@keyframes p{50%{box-shadow:0 0 44px #00caffcc;transform:scale(1.07)}}
#log{background:#102b3c;border-radius:12px;padding:12px;height:300px;overflow:auto}
.m{margin:8px 0;padding:8px 12px;border-radius:12px;max-width:85%;line-height:1.4}
.u{background:#1f6f8b;margin-left:auto}.a{background:#173f56}.t{font-size:11px;color:#7fb8d6;margin-top:4px}
.row{display:flex;gap:8px;margin-top:12px}input{flex:1;padding:12px;border-radius:10px;border:0;font-size:15px}
button{border:0;border-radius:10px;padding:12px 14px;background:#00caff;color:#06222f;font-weight:600;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chips button{background:#173f56;color:#bfe9f7;font-weight:400;font-size:12px;padding:6px 10px}
</style></head><body><div class="app">
<h1>🌾 Farm Helper</h1><div class="sub">Simulated Alexa+ experience · powered by an MCP server (Streamable HTTP)</div>
<div class="ring" id="ring"></div>
<div id="log"><div class="m a">Hi! Ask about crop diseases, watering, prices, or sowing time.</div></div>
<div class="row"><input id="q" placeholder="Alexa, ask Farm Helper..." autofocus><button id="cam">📷</button><input type="file" id="file" accept="image/*" hidden><button id="mic">🎤</button><button id="go">Ask</button></div>
<div class="chips" id="chips"></div></div>
<script>
const log=document.getElementById('log'),q=document.getElementById('q'),ring=document.getElementById('ring');
["Is my tomato leaf healthy? It has yellow leaves with brown spots","Should I water my ragi in Bengaluru today?","What is the price of tomato?","When should I sow rice?"]
.forEach(t=>{const b=document.createElement('button');b.textContent=t.length>34?t.slice(0,34)+'…':t;b.onclick=()=>ask(t);document.getElementById('chips').append(b)});
function add(cls,txt,tool){const d=document.createElement('div');d.className='m '+cls;d.textContent=txt;
 if(tool){const t=document.createElement('div');t.className='t';t.textContent='MCP tool called: '+tool;d.append(t)}
 log.append(d);log.scrollTop=log.scrollHeight}
function speak(t){if(!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(t);u.onstart=()=>ring.classList.add('on');u.onend=()=>ring.classList.remove('on');speechSynthesis.cancel();speechSynthesis.speak(u)}
async function ask(text){text=(text||q.value).trim();if(!text)return;q.value='';add('u',text);
 try{const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
 const j=await r.json();add('a',j.reply,j.tool);speak(j.reply)}catch(e){add('a','Server not reachable.')}}
document.getElementById('go').onclick=()=>ask();q.onkeydown=e=>{if(e.key==='Enter')ask()};
const file=document.getElementById('file');
document.getElementById('cam').onclick=()=>file.click();
file.onchange=()=>{const f=file.files[0];if(!f)return;const img=new Image();img.onload=async()=>{
 const s=Math.min(1,1024/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;
 c.getContext('2d').drawImage(img,0,0,c.width,c.height);const data=c.toDataURL('image/jpeg',0.85);
 const d=document.createElement('div');d.className='m u';const im=document.createElement('img');im.src=data;im.style.maxWidth='100%';im.style.borderRadius='8px';d.append(im);log.append(d);
 try{const r=await fetch('/api/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:data.split(',')[1],crop:'plant'})});const j=await r.json();add('a',j.reply,j.tool);speak(j.reply)}catch(e){add('a','Server not reachable.')}
 file.value='';};img.src=URL.createObjectURL(f)};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
document.getElementById('mic').onclick=()=>{if(!SR)return add('a','Voice input needs Chrome or Edge.');
 const r=new SR();r.lang='en-IN';ring.classList.add('on');r.onresult=e=>ask(e.results[0][0].transcript);r.onend=()=>ring.classList.remove('on');r.start()};
</script></body></html>
